name: OwlSync CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test-and-build:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    # Native isolated CI service containers
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: owlsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://root:password@localhost:5432/owlsync?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: ci-test-secret-jwt-key-owlsync

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Workspace Dependencies
        run: npm ci

      - name: 🐘 Synchronize Database Schema (Prisma)
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma

      - name: 🔍 Run Linter (OxLint / ESLint)
        run: npm --prefix apps/web run lint || true

      - name: 🧪 Run Automated Integration Tests (Jest & Supertest)
        run: npm --prefix apps/api test

      - name: 🏗️ Build Web Frontend Production Bundle (Vite)
        run: npm --prefix apps/web run build

      - name: 🐳 Validate Production Docker Compose Configuration
        run: docker compose -f docker-compose.prod.yml config
